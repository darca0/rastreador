<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rastreador v24.0 FINAL</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
body{background:#111;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#loginScreen{position:fixed;inset:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
#loginScreen h1{font-size:24px}#loginNome{color:#4caf50;font-weight:700;margin-bottom:20px}
.pin-dot{width:15px;height:15px;border-radius:50%;background:#333;border:2px solid #555;display:inline-block;margin:5px}
.pin-dot.filled{background:#1565C0;border-color:#1565C0}
#pinDisplay{margin-bottom:20px}.numpad{display:grid;grid-template-columns:repeat(3,70px);gap:12px}
.numpad button{height:70px;border-radius:50%;background:#222;border:1px solid #333;color:#fff;font-size:24px;cursor:pointer}
.numpad button:active{background:#1565C0}
#loginError{color:#f44336;margin-top:10px;min-height:18px}
#topbar{display:none;background:rgba(0,0,0,.85);padding:6px 12px;align-items:center;gap:8px}
.badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700}.badge-ok{background:#2e7d32;color:#fff}.badge-off{background:#444;color:#aaa}
#map{flex:1;width:100%}
#panel{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.9);padding:8px;border-top:1px solid #444}
#panelNome{font-size:12px;margin-bottom:6px}
.info-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.info-pill{background:#222;border:1px solid #444;border-radius:8px;padding:3px 10px;font-size:12px}
.btn-row{display:flex;gap:6px}.btn{flex:1;padding:10px;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.btn-green{background:#2e7d32;color:#fff}.btn-red{background:#c62828;color:#fff}
#panicAlert{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#b71c1c;color:#fff;padding:20px;border-radius:12px;text-align:center;z-index:9999;cursor:pointer}
#panicAlert strong{font-size:26px;display:block;margin-bottom:8px}
@keyframes pulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
#panicAlert.pulsing{animation:pulse .8s infinite}
</style>
</head>
<body>
<div id="loginScreen">
<h1>🛡️ Rastreador</h1>
<p id="loginNome">ADMIN</p>
<div id="pinDisplay"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
<div id="loginError"></div>
<div class="numpad">
<button onclick="pin('1')">1</button><button onclick="pin('2')">2</button><button onclick="pin('3')">3</button>
<button onclick="pin('4')">4</button><button onclick="pin('5')">5</button><button onclick="pin('6')">6</button>
<button onclick="pin('7')">7</button><button onclick="pin('8')">8</button><button onclick="pin('9')">9</button>
<button onclick="pin('del')">⌫</button><button onclick="pin('0')">0</button><button onclick="pin('del')">✕</button>
</div>
</div>
<div id="topbar"><span style="font-weight:700">🛡️</span><span id="nomeUsuario"></span><span class="badge badge-off" id="mqttBadge">Desconectado</span><button onclick="nextMapStyle()" id="mapStyleBtn" style="margin-left:auto;background:#222;color:#fff;border:1px solid #444;padding:4px 10px;border-radius:12px;font-size:11px;cursor:pointer">🛰 Satélite</button></div>
<div id="map"></div>
<div id="panicAlert" onclick="cancelarPanico()"><strong>🚨 PÂNICO ATIVADO</strong><span id="panicTimer">60s para cancelar</span></div>
<div id="panel">
<div id="panelNome">Aguardando veículo...</div>
<div class="info-row"><span class="info-pill" id="pVel">0.0 km/h</span><span class="info-pill" id="pSat">0 sat</span><span class="info-pill" id="pRssi">— dBm</span></div>
<div class="btn-row"><button class="btn btn-red" id="btnBlock" onclick="cmd('BLOQUEAR')" style="display:none">🔴 Bloqueado</button><button class="btn btn-green" id="btnUnlock" onclick="cmd('DESBLOQUEAR')">🟢 Liberado</button></div>
</div>
<script>
const USUARIOS={'admin':'8912','zerruela':'3412'};
const _u=new URLSearchParams(window.location.search).get('u')||'';
let usuarioId=_u.toLowerCase().trim();
if(!usuarioId||!(usuarioId in USUARIOS))usuarioId='admin';
document.getElementById('loginNome').textContent='👤 '+usuarioId.toUpperCase();
let pinBuffer='',map,mqttClient,tileLayer,veiculos={},ativoId=null;
let currentStyle='map';
const PARADA_MIN_MS=360000,RAIO=50,VEL_PARADA=2.0;
let panicoAtivo=false,panicoTimer=null,panicoCancelavel=true;
const BROKER_WSS='wss://5e7c95681b9f45068546a87087ed9e2c.s1.eu.hivemq.cloud/mqtt';
const BROKER_PORT=8884;
function pin(v){
if(v==='del'){pinBuffer=pinBuffer.slice(0,-1)}else if(pinBuffer.length<4){pinBuffer+=v}
updateDots();
if(pinBuffer.length===4){
if(pinBuffer===USUARIOS[usuarioId]){
document.getElementById('loginScreen').style.display='none';
document.getElementById('topbar').style.display='flex';
document.getElementById('panel').style.display='block';
document.getElementById('nomeUsuario').textContent='👤 '+usuarioId.toUpperCase();
iniciarMapa();conectarMQTT();
}else{
document.getElementById('loginError').textContent='PIN incorreto';
pinBuffer='';updateDots();
setTimeout(()=>{document.getElementById('loginError').textContent=''},1000);
}}}
function updateDots(){document.querySelectorAll('.pin-dot').forEach((d,i)=>{d.className='pin-dot'+(i<pinBuffer.length?' filled':'')})}
function iniciarMapa(){
map=L.map('map').setView([-22.7078,-47.6659],13);
tileLayer=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
}
function nextMapStyle(){
if(currentStyle==='map'){
tileLayer.setUrl('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
document.getElementById('mapStyleBtn').textContent='🗺 Mapa';
currentStyle='satellite';
}else{
tileLayer.setUrl('https://tile.openstreetmap.org/{z}/{x}/{y}.png');
document.getElementById('mapStyleBtn').textContent='🛰 Satélite';
currentStyle='map';
}
}
function conectarMQTT(){
if(mqttClient){mqttClient.end(true)}
setBadge('mqttBadge','Conectando...','badge-off');
const clientId='Web_'+usuarioId+'_'+Math.random().toString(36).slice(2,6);
mqttClient=mqtt.connect(BROKER_WSS,{port:BROKER_PORT,clientId,username:'ESP8266Dario',password:'3SP8266d4r10',reconnectPeriod:5000});
mqttClient.on('connect',()=>{setBadge('mqttBadge','Conectado','badge-ok');mqttClient.subscribe('rastreador/'+usuarioId+'/+/gps');mqttClient.subscribe('rastreador/'+usuarioId+'/+/status');addLog('Conectado como '+usuarioId)});
mqttClient.on('error',(e)=>addLog('MQTT Erro: '+e.message));
mqttClient.on('message',(topic,payload)=>{
try{
const p=topic.split('/'),chipId=p[2],tipo=p[3],d=JSON.parse(payload.toString());
if(tipo==='gps')processarGPS(chipId,d);
if(tipo==='status')processarStatus(chipId,d);
}catch(e){}});
}
function cmd(comando){
if(!ativoId)return;
mqttClient.publish('rastreador/'+usuarioId+'/'+ativoId+'/cmd',comando);
addLog('→ '+comando);
}
function obterVeiculo(chipId){
if(!veiculos[chipId]){
veiculos[chipId]={chipId,nome:'Veículo '+chipId.slice(-4).toUpperCase(),bloqueado:false,pendente:false,vel:0,sat:0,rssi:0,alt:0,marker:null,trail:L.polyline([],{color:'#1565C0',weight:3,opacity:.8}).addTo(map),ultimaPos:null,paradaInicio:null,paradaPos:null,paradaCirculo:null,pingos:[],contador:0};
if(!ativoId)ativoId=chipId;
}
return veiculos[chipId];
}
function processarGPS(chipId,d){
const v=obterVeiculo(chipId);
if(d.rssi!==undefined)v.rssi=d.rssi;if(d.sat!==undefined)v.sat=d.sat;if(d.spd!==undefined)v.vel=d.spd;
if(d.bloqueado!==undefined)v.bloqueado=d.bloqueado===true;if(d.pendente!==undefined)v.pendente=d.pendente===true;
if(d.fix===false)return;
if(!d.lat||!d.lng)return;
const pos=L.latLng(parseFloat(d.lat),parseFloat(d.lng));
v.ultimaPos=pos;
if(!v.marker){v.marker=L.marker(pos,{icon:mkIcon(cor(v))}).addTo(map);if(chipId===ativoId)map.setView(pos,16)}else{v.marker.setLatLng(pos);v.marker.setIcon(mkIcon(cor(v)))}
v.trail.addLatLng(pos);
if(v.vel<=VEL_PARADA){
if(!v.paradaInicio){v.paradaInicio=Date.now();v.paradaPos=pos;addLog('Parada detectada')}
else{
const dist=map.distance(v.paradaPos,pos);
if(dist>RAIO){v.paradaInicio=Date.now();v.paradaPos=pos;if(v.paradaCirculo){v.paradaCirculo.remove();v.paradaCirculo=null}}
if(Date.now()-v.paradaInicio>=PARADA_MIN_MS){
if(!v.paradaCirculo){v.contador++;const icone=L.divIcon({className:'',html:'<div style="background:#FF6B00;color:#fff;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-weight:bold;border:3px solid #fff">P'+v.contador+'</div>',iconSize:[40,40],iconAnchor:[20,20]});v.paradaCirculo=L.marker(v.paradaPos,{icon:icone}).addTo(map);addLog('Parada P'+v.contador+' registrada')}
}}}
else{if(v.paradaCirculo){v.paradaCirculo=null}v.paradaInicio=null;v.paradaPos=null}
if(chipId===ativoId)atualizarPainel(v);
}
function processarStatus(chipId,d){
const v=obterVeiculo(chipId);
if(d.bloqueado!==undefined)v.bloqueado=d.bloqueado===true;if(d.pendente!==undefined)v.pendente=d.pendente===true;
if(v.marker)v.marker.setIcon(mkIcon(cor(v)));
if(d.motivo==='panico'){ativarPanico()}
if(d.motivo==='panico_cancelado'){panicoCancelavel=true;cancelarPanico()}
if(d.motivo==='panico_confirmado'){panicoCancelavel=false;clearInterval(panicoTimer);document.getElementById('panicAlert').classList.remove('pulsing');document.getElementById('panicTimer').textContent='⚠️ TRAVADO'}
if(chipId===ativoId)atualizarPainel(v);
}
function atualizarPainel(v){
document.getElementById('panelNome').textContent='🚗 '+v.nome+' ('+v.chipId+')';
document.getElementById('pVel').textContent=v.vel.toFixed(1)+' km/h';
document.getElementById('pSat').textContent=v.sat+' sat';
document.getElementById('pRssi').textContent=(v.rssi||'—')+' dBm';
const bB=document.getElementById('btnBlock'),bU=document.getElementById('btnUnlock');
bB.style.display='none';bU.style.display='none';
if(v.bloqueado){bB.style.display='block'}else{bU.style.display='block'}
}
function cor(v){return v.bloqueado?'#c62828':v.pendente?'#f9a825':'#2e7d32'}
function mkIcon(c){return L.divIcon({className:'',html:'<div style="background:'+c+';border-radius:50%;width:22px;height:22px;border:3px solid #fff"></div>',iconSize:[22,22],iconAnchor:[11,11]})}
function setBadge(id,txt,cls){const el=document.getElementById(id);if(el){el.textContent=txt;el.className='badge '+cls}}
function addLog(msg){console.log('['+new Date().toTimeString().slice(0,8)+'] '+msg)}
function ativarPanico(){
panicoAtivo=true;panicoCancelavel=true;
document.getElementById('panicAlert').style.display='block';
document.getElementById('panicAlert').classList.add('pulsing');
let seg=60;const timer=document.getElementById('panicTimer');timer.textContent=seg+'s para cancelar';
panicoTimer=setInterval(()=>{
seg--;if(seg>0){timer.textContent=seg+'s para cancelar'}
else{clearInterval(panicoTimer);panicoCancelavel=false;timer.textContent='⚠️ CONFIRMADO'}
},1000);
}
function cancelarPanico(){
if(!panicoCancelavel)return;
clearInterval(panicoTimer);
document.getElementById('panicAlert').style.display='none';
document.getElementById('panicAlert').classList.remove('pulsing');
}
function salvarMapa(){
const pontos=Object.values(veiculos).flatMap(v=>v.trail.getLatLngs().map(p=>[p.lat,p.lng]));
const data=new Date().toLocaleString();
const html=`<!DOCTYPE html><html><head><title>Trajeto</title></head><body><h1>Trajeto ${data}</h1><pre>${JSON.stringify(pontos,null,2)}</pre></body></html>`;
const blob=new Blob([html],{type:'text/html'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='trajeto.html';
a.click();
}
</script>
</body>
</html>
