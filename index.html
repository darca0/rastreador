<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Rastreador v15.0</title>
<style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #111; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* LOGIN */
    #loginScreen { position: fixed; inset: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
    #loginScreen h1 { font-size: 24px; }
    #loginNome { color: #4caf50; font-weight: 700; margin-bottom: 20px; }
    .pin-dot { width: 15px; height: 15px; border-radius: 50%; background: #333; border: 2px solid #555; display: inline-block; margin: 5px; }
    .pin-dot.filled { background: #1565C0; border-color: #1565C0; }
    #pinDisplay { margin-bottom: 20px; }
    .numpad { display: grid; grid-template-columns: repeat(3, 70px); gap: 12px; }
    .numpad button { height: 70px; border-radius: 50%; background: #222; border: 1px solid #333; color: #fff; font-size: 24px; cursor: pointer; }
    .numpad button:active { background: #1565C0; }
    #loginError { color: #f44336; margin-top: 10px; min-height: 18px; }

    /* MAPA */
    #map { flex: 1; width: 100%; }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
    <h1>🛡️ Rastreador</h1>
    <p id="loginNome">ADMIN</p>
    <div id="pinDisplay"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
    <div id="loginError"></div>
    <div class="numpad">
        <button onclick="pin('1')">1</button><button onclick="pin('2')">2</button><button onclick="pin('3')">3</button>
        <button onclick="pin('4')">4</button><button onclick="pin('5')">5</button><button onclick="pin('6')">6</button>
        <button onclick="pin('7')">7</button><button onclick="pin('8')">8</button><button onclick="pin('9')">9</button>
        <button onclick="pin('del')">⌫</button><button onclick="pin('0')">0</button><button onclick="pin('del')">✕</button>
    </div>
</div>

<!-- MAPA -->
<div id="map"></div>

<script>
    // CONFIGURAÇÃO
    const USUARIOS = { 'admin': '8912', 'zerruela': '3412' };
    const _u = new URLSearchParams(window.location.search).get('u') || '';
    let usuarioId = _u.toLowerCase().trim();
    if (!usuarioId || !(usuarioId in USUARIOS)) usuarioId = 'admin';
    document.getElementById('loginNome').textContent = '👤 ' + usuarioId.toUpperCase();

    let pinBuffer = '';
    function pin(v) {
        if (v === 'del') { pinBuffer = pinBuffer.slice(0, -1); }
        else if (pinBuffer.length < 4) { pinBuffer += v; }
        updateDots();
        if (pinBuffer.length === 4) {
            if (pinBuffer === USUARIOS[usuarioId]) {
                document.getElementById('loginScreen').style.display = 'none';
                iniciarMapa();
            } else {
                document.getElementById('loginError').textContent = 'PIN incorreto';
                pinBuffer = '';
                updateDots();
                setTimeout(() => { document.getElementById('loginError').textContent = ''; }, 1000);
            }
        }
    }
    function updateDots() {
        document.querySelectorAll('.pin-dot').forEach((d, i) => {
            d.className = 'pin-dot' + (i < pinBuffer.length ? ' filled' : '');
        });
    }

    // MAPA
    function iniciarMapa() {
        const map = L.map('map').setView([-22.7078, -47.6659], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        }).addTo(map);
    }
</script>
</body>
</html>
