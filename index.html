<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/leaflet-image@0.4.0/leaflet-image.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GatewayConnectCar</title>
<link rel="manifest" href="/rastreador/manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<link rel="icon" type="image/png" href="/rastreador/web-app-manifest-192x192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #111; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  #loginScreen { position: fixed; inset: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; gap: 12px; padding: 20px; }
  #loginScreen h1 { font-size: 22px; font-weight: 700; }
  .pin-dot { width: 16px; height: 16px; border-radius: 50%; background: #333; border: 2px solid #555; display: inline-block; margin: 0 4px; transition: all 0.15s; }
  .pin-dot.filled { background: #1565C0; border-color: #1565C0; }
  #pinDisplay { display: flex; gap: 12px; margin: 8px 0; justify-content: center; }
  .numpad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; margin-top: 8px; }
  .numpad button { width: 72px; height: 72px; border-radius: 50%; background: #222; border: 1px solid #333; color: #fff; font-size: 24px; cursor: pointer; transition: all 0.1s; }
  .numpad button:active { background: #1565C0; transform: scale(0.95); }
  #loginError { color: #f44336; font-size: 13px; min-height: 18px; }
  #inputUsuario { width:100%; padding:12px; border-radius:8px; border:1px solid #444; background:#1a1a1a; color:#fff; font-size:16px; text-align:center; }
  
  #topbar { display:none; background: rgba(0,0,0,0.85); border-bottom: 1px solid #222; z-index: 1000; padding: 4px 8px; }
  #topbar .row { display:flex; align-items:center; gap:6px; flex-wrap:nowrap; overflow-x:auto; white-space:nowrap; font-size:11px; }
  #topbar .row + .row { margin-top: 3px; }
  .badge { padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; border: 1px solid; white-space: nowrap; }
  .badge-ok { background: #2e7d3288; color: #a5d6a7; border-color: #2e7d32; }
  .badge-err { background: #c6282888; color: #ef9a9a; border-color: #c62828; }
  .badge-warn { background: #f9a82588; color: #fff8e1; border-color: #f9a825; animation: blink 1s infinite; }
  .badge-off { background: #33333388; color: #888; border-color: #444; }
  @keyframes blink { 50% { opacity: 0.5; } }
  #nomeUsuario { font-size:11px; color:#4caf50; font-weight:700; }
  #veiculoAtivoNome { font-size:11px; font-weight:700; color:#90caf9; }
  
  #map { flex: 1; z-index: 1; }
  
  /* ✅ PAINEL DE DEBUG NA TELA */
  #debugPanel { position: absolute; top: 80px; left: 10px; z-index: 9999; background: rgba(0, 0, 0, 0.85); border: 1px solid #2e7d32; color: #4caf50; padding: 8px; border-radius: 8px; font-family: monospace; font-size: 11px; display: none; pointer-events: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  
  #panel { display:none; position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.88); padding:6px 8px; z-index:1000; border-top:1px solid #222; }
  #panelNome { font-size:11px; font-weight:700; color:#90caf9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:4px; }
  .info-row { display:flex; align-items:center; gap:4px; flex-wrap:wrap; margin-bottom:4px; }
  .info-pill { background:#1a1a1a; border:1px solid #333; border-radius:8px; padding:2px 8px; font-size:11px; color:#ccc; white-space:nowrap; }
  .btn-row { display:flex; align-items:center; gap:6px; }
  .map-btn { flex:1; height:44px; padding:0 8px; border-radius:10px; border:none; font-size:14px; font-weight:700; cursor:pointer; transition:all 0.15s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .map-btn:active { transform: scale(0.97); }
  .btn-block  { background:#c62828; color:#fff; }
  .btn-unlock { background:#2e7d32; color:#fff; }
  .btn-center { flex:0 0 44px; width:44px; height:44px; background:#1565C0; color:#fff; border:none; border-radius:10px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <h1>🚗 GatewayConnectCar</h1>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; width:80%; max-width:300px;">
    <input type="text" id="inputUsuario" placeholder="Usuário" value="zerruela">
    <div id="pinDisplay">
      <div class="pin-dot" id="dot0"></div>
      <div class="pin-dot" id="dot1"></div>
      <div class="pin-dot" id="dot2"></div>
      <div class="pin-dot" id="dot3"></div>
    </div>
    <div id="loginError"></div>
  </div>
  <div class="numpad">
    <button onclick="window.pin('1')">1</button><button onclick="window.pin('2')">2</button><button onclick="window.pin('3')">3</button>
    <button onclick="window.pin('4')">4</button><button onclick="window.pin('5')">5</button><button onclick="window.pin('6')">6</button>
    <button onclick="window.pin('7')">7</button><button onclick="window.pin('8')">8</button><button onclick="window.pin('9')">9</button>
    <button onclick="window.pin('del')">⌫</button><button onclick="window.pin('0')">0</button><button onclick="window.pin('del')">✕</button>
  </div>
  <button onclick="window.loginComUsuario()" style="padding:12px 40px; border-radius:12px; border:none; background:#1565C0; color:#fff; font-size:16px; font-weight:700; cursor:pointer; margin-top:8px;">Entrar</button>
</div>

<!-- TOPBAR -->
<div id="topbar">
  <div class="row">
    <span id="nomeUsuario"></span>
    <span class="badge badge-off" id="mqttBadge">Conectando</span>
    <span class="badge badge-off" id="veiculosBadge" style="margin-left:auto;">0 veículos</span>
  </div>
  <div class="row">
    <span id="veiculoAtivoNome">Aguardando...</span>
  </div>
</div>

<!-- MAPA -->
<div id="map"></div>

<!-- ✅ PAINEL DE DEBUG -->
<div id="debugPanel">Aguardando conexão...</div>

<!-- PAINEL INFERIOR -->
<div id="panel">
  <div id="panelNome">Aguardando veículo...</div>
  <div class="info-row">
    <span class="info-pill" id="pVel">0.0 km/h</span>
    <span class="info-pill" id="pSat">0 sat</span>
    <span class="info-pill" id="pRssi">— dBm</span>
  </div>
  <div class="btn-row">
    <button class="btn-center" onclick="window.centralizarAtivo()">◎</button>
    <button class="map-btn btn-unlock" id="btnUnlock">🟢 Liberado</button>
  </div>
</div>

<script>
const USUARIOS = { 'block': '6001', 'cicrano': '0123', 'zerruela': '3412' };
const BROKER_WSS = 'wss://5e7c95681b9f45068546a87087ed9e2c.s1.eu.hivemq.cloud/mqtt';
const BROKER_PORT = 8884;
const PARADA_VEL = 8.0;
const TILES = {
  map: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'
};
let pinBuffer = '', usuarioId = '', map, tileLayer, mqttClient;
let veiculos = {}, ativoId = null;

window.pin = function(v) {
  if (v === 'del') pinBuffer = pinBuffer.slice(0, -1);
  else if (pinBuffer.length < 4) pinBuffer += v;
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('dot' + i);
    if (dot) dot.className = 'pin-dot' + (i < pinBuffer.length ? ' filled' : '');
  }
  if (pinBuffer.length === 4) window.loginComUsuario();
};

window.loginComUsuario = function() {
  const usuario = document.getElementById('inputUsuario').value.trim().toLowerCase();
  if (!usuario) { document.getElementById('loginError').textContent = '⚠️ Digite um usuário!'; resetPin(); return; }
  if (!USUARIOS[usuario]) { document.getElementById('loginError').textContent = '❌ Usuário inválido!'; resetPin(); return; }
  if (pinBuffer === USUARIOS[usuario]) {
    usuarioId = usuario;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('topbar').style.display = 'block';
    document.getElementById('panel').style.display = 'block';
    document.getElementById('nomeUsuario').textContent = '👤 ' + usuarioId;
    window.iniciarApp();
  } else {
    document.getElementById('loginError').textContent = '❌ PIN incorreto';
    resetPin();
  }
};

function resetPin() {
  pinBuffer = '';
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('dot' + i);
    if (dot) dot.className = 'pin-dot';
  }
  setTimeout(() => { document.getElementById('loginError').textContent = ''; }, 2000);
}

window.iniciarApp = function() {
  map = L.map('map', { zoomControl: false }).setView([-22.7078, -47.6659], 13);
  L.control.zoom({ position: 'topleft' }).addTo(map);
  tileLayer = L.tileLayer(TILES.map, { maxZoom: 19, crossOrigin: true, attribution: '© Esri' }).addTo(map);
  
  // Mostra o painel de debug
  document.getElementById('debugPanel').style.display = 'block';
  document.getElementById('debugPanel').innerText = '⏳ Iniciando conexão...';
  
  window.conectarMQTT();
};

window.conectarMQTT = function() {
  if (mqttClient) { mqttClient.end(true); }
  mqttClient = mqtt.connect(BROKER_WSS, {
    port: BROKER_PORT,
    clientId: 'Web_' + usuarioId + '_' + Math.random().toString(36).slice(2, 6),
    username: 'ESP8266Dario', password: '3SP8266d4r10', reconnectPeriod: 5000
  });
  
  mqttClient.on('connect', () => {
    document.getElementById('mqttBadge').textContent = '✅ MQTT';
    document.getElementById('mqttBadge').className = 'badge badge-ok';
    document.getElementById('debugPanel').innerText = '✅ MQTT Conectado.\nAguardando dados do GPS...';
    
    mqttClient.subscribe('rastreador/' + usuarioId + '/+/gps');
    mqttClient.subscribe('rastreador/' + usuarioId + '/+/status');
  });
  
  mqttClient.on('disconnect', () => {
    document.getElementById('mqttBadge').textContent = 'Desconectado';
    document.getElementById('mqttBadge').className = 'badge badge-err';
    document.getElementById('debugPanel').innerText = '❌ MQTT Desconectado.';
  });

  mqttClient.on('message', (topic, payload) => {
    try {
      const parts = topic.split('/');
      const chipId = parts[2], tipo = parts[3];
      const data = JSON.parse(payload.toString());
      
      if (tipo === 'gps') {
        window.processarGPS(chipId, data);
      }
      if (tipo === 'status') {
        window.processarStatus(chipId, data);
      }
    } catch(e) { console.error("Erro no MQTT:", e); }
  });
};

window.processarGPS = function(chipId, d) {
  if (!veiculos[chipId]) {
    veiculos[chipId] = {
      chipId: chipId, nome: 'Veículo ' + chipId.slice(-4).toUpperCase(),
      bloqueado: false, vel: 0, sat: 0, rssi: 0,
      marker: null, ultimaPos: null
    };
    if (!ativoId) {
        ativoId = chipId;
        document.getElementById('veiculosBadge').textContent = '1 veículo';
        document.getElementById('veiculosBadge').className = 'badge badge-ok';
        document.getElementById('panelNome').textContent = '🚗 ' + veiculos[chipId].nome;
    }
  }
  
  const v = veiculos[chipId];
  if (d.spd !== undefined) v.vel = d.spd;
  if (d.sat !== undefined) v.sat = d.sat;
  if (d.rssi !== undefined) v.rssi = d.rssi;

  // ✅ ATUALIZA O PAINEL DE DEBUG NA TELA
  const debug = document.getElementById('debugPanel');
  if (d.lat == 0 || d.lng == 0) {
      debug.innerHTML = `⚠️ Recebido do carro [${chipId.slice(-4)}]<br>Mas GPS sem fix (0,0)`;
      return;
  }

  debug.innerHTML = `📍 Dados Recebidos [${chipId.slice(-4)}]<br>Lat: ${d.lat}<br>Lng: ${d.lng}<br>Vel: ${d.spd} km/h`;

  const pos = L.latLng(parseFloat(d.lat), parseFloat(d.lng));
  v.ultimaPos = pos;
  
  if (!v.marker) {
    v.marker = L.marker(pos).addTo(map);
    map.setView(pos, 16);
  } else {
    v.marker.setLatLng(pos);
    // ✅ FAZ O MAPA SEGUIR O CARRO
    if (chipId === ativoId) {
        map.panTo(pos);
    }
  }

  // Atualiza painel inferior
  document.getElementById('pVel').textContent = v.vel.toFixed(1) + ' km/h';
  document.getElementById('pSat').textContent = v.sat + ' sat';
  document.getElementById('pRssi').textContent = v.rssi + ' dBm';
};

window.processarStatus = function(chipId, d) {
  const v = veiculos[chipId];
  if (!v) return;
  if (d.bloqueado !== undefined) v.bloqueado = d.bloqueado === true;
  
  const btn = document.getElementById('btnUnlock');
  if (v.bloqueado) {
    btn.textContent = '🔴 Desbloquear';
    btn.className = 'map-btn btn-block';
  } else {
    btn.textContent = '🟢 Liberado';
    btn.className = 'map-btn btn-unlock';
  }
};

window.centralizarAtivo = function() {
  if (ativoId && veiculos[ativoId] && veiculos[ativoId].ultimaPos) {
    map.setView(veiculos[ativoId].ultimaPos, 16);
  }
};
</script>
</body>
</html>
